# Supabase Local Development Configuration
# For production, configure SMTP and templates in the Supabase Dashboard.

[project]
id = "sendaway"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.email.smtp]
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@ftrmsg.com"
sender_name = "FtrMsg"

[auth.email.template.confirmation]
subject = "Confirm your FtrMsg account"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your FtrMsg password"
content_path = "./templates/recovery.html"

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
